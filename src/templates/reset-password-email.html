<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <title>Скидання паролю</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px;">
        <h2 style="color: #333;">Привіт, {{username}}!</h2>
        <p style="color: #555; font-size: 16px;">
            Ви отримали цей лист, тому що хтось (сподіваємось, ви) запросив скидання паролю для вашого акаунта.
        </p>
        <p style="color: #555; font-size: 16px;">
            Щоб встановити новий пароль, натисніть кнопку нижче. Посилання дійсне протягом 15 хвилин.
        </p>
        <p style="text-align: center; margin: 30px 0;">
            <a href="{{resetLink}}"
                style="background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-size: 16px;">
                Скинути пароль
            </a>
        </p>
        <p style="color: #999; font-size: 14px;">
            Якщо ви не запитували скидання паролю, просто проігноруйте цей лист.
        </p>
    </div>
</body>

</html>
